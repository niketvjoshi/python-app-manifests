apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "python-app.fullname" . }}-test"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "python-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test
      image: busybox
      command: ['wget']
      args:
        - '--spider'
        - 'http://{{ include "python-app.fullname" . }}:{{ .Values.service.port }}/health'
  restartPolicy: Never